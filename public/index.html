<!doctype html>
<html lang="en">
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset="utf-8" />
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- get rid of favicon error -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  </head>
  <body>
    <h1>Vehicle Registry</h1>
    <p id="description">Add vehicles using the form below, delete vehicles using the buttons next to each vehicle listing, and edit vehicle listings by clicking on the listing.</p>
    <div id="add-vehicle-block">
      <h2>Add Vehicle</h2>
      <form id="add-vehicle-form">
        <label>
          Year
          <input type="text" id="year-input" placeholder="2010">
        </label>
        <label>
          Model
          <input type="text" id="model-input" placeholder="Subaru">
        </label>
        <label>
          MPG
          <input type="text" id="mpg-input" placeholder="22">
        </label>
        <button id="submit-vehicle-button">Submit</button>
      </form>
    </div>
    <div id="vehicle-list-block">
      <h2>Vehicle Listings</h2>
    </div>
  </body>
</html>

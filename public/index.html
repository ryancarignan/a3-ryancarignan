<!doctype html>
<html lang="en">
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset="utf-8" />
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/base-min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" 
      integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- get rid of favicon error -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  </head>
  <body>
    <h1>Vehicle Registry</h1>
    <p id="description">Add vehicles using the form below, delete vehicles using the buttons next to each vehicle listing, and edit vehicle listings by clicking on the listing.</p>
    <div id="add-vehicle-block">
      <h2>Add Vehicle</h2>
      <form id="add-vehicle-form" class="pure-form pure-g">
        <label class="pure-u-1-4">
          Year
          <input type="number" id="year-input" placeholder="2010">
        </label>
        <label class="pure-u-1-4">
          Model
          <input type="text" id="model-input" placeholder="Subaru">
        </label>
        <label class="pure-u-1-4">
          MPG
          <input type="number" id="mpg-input" placeholder="22">
        </label>
        <div class="pure-u-1-8"></div>
        <button id="submit-vehicle-button" class="pure-button button-submit pure-u-1-8">Submit</button>
      </form>
    </div>
    <div id="vehicle-list-block">
      <h2>Vehicle Listings</h2>
    </div>
  </body>
</html>

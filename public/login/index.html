<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS4241 Assignment 3</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/base-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" 
    integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css" />
  <script src="main.js"></script>
</head>
<body>
  <h1>Login</h1>
  <form class="pure-form pure-form-stacked">
    <label>
      Username:
      <input type="text" name="username" id="username-input">
    </label>
    <label>
      Password:
      <input type="password" name="password" id="password-input">
    </label>
    <div>
      <button type="button" id="login-button" class="pure-button pure-button-primary">Sign in</button>
      <button type="button" id="create-account-button" class="pure-button">Create new account</button>
    </div>
  </form>
</body>
</html>
